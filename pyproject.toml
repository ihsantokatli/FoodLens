[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foodlens"
version = "0.1.0"
description = "Food-101 yemek siniflandirma - EfficientNet-B0 transfer learning (PyTorch + Gradio)"
requires-python = ">=3.9"
# Calisma zamani bagimliliklari requirements.txt'te tutulur
# (torch/torchvision platform bazli kurulurdur; Colab'da onceden gelir).

[tool.setuptools.packages.find]
where = ["src"]
